<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClutchCrosshair</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>ClutchCrosshair</h1>
        <input type="text" id="search" placeholder="Search a player, team or creator...">
        <button id="theme-toggle">Light mode</button>
    </header>

    <nav id="teams"></nav>

    <main>
                <section id="trending">
            <h2>Trending</h2>
        </section>
        <section id="pros">
            
            <h2>Pros</h2>
        </section>

        <section id="creators">
            <h2>Creators</h2>
        </section>
    </main>

    <footer>
        <p>© 2026 ClutchCrosshair. All rights reserved.</p>
    </footer>

    <div id="modal" class="modal hidden">
        <div class="modal-box">
            <button id="modal-close" class="modal-close">✕</button>
            <div id="modal-photo" class="modal-photo"></div>            <h2 id="modal-name"></h2>
            <p id="modal-team" class="modal-team"></p>
            <p id="modal-date" class="modal-date"></p>
            <p id="modal-code" class="modal-code"></p>
            <button id="modal-copy">Copy crosshair</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
